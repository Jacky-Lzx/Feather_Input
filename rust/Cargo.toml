[workspace]
members = [
    "crates/feather-core",
    "crates/feather-engine-lexicon",
    "crates/feather-engine-rime",
    "crates/feather-ffi",
    "crates/feather-trace",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
